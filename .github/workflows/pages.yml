name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: scopepunk/pnpm-lock.yaml

      - name: Build Scopepunk
        working-directory: scopepunk
        env:
          GITHUB_PAGES: "1"
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Assemble site
        run: |
          mkdir -p _site/presetpunk _site/scopepunk
          rsync -a \
            --exclude node_modules \
            --exclude midi \
            --exclude out \
            --exclude .chrome-profile \
            --exclude .DS_Store \
            --exclude tests \
            --exclude tools \
            presetpunk/ _site/presetpunk/
          rsync -a scopepunk/dist/ _site/scopepunk/
          cp site/index.html _site/index.html
          touch _site/.nojekyll
          BUILD_MS=$(node -e 'process.stdout.write(String(Date.now()))')
          VER=$(node -p "require('./presetpunk/package.json').version")
          python3 - <<PY
          from pathlib import Path
          import re
          build = "${BUILD_MS}"
          ver = "${VER}"
          index = Path("_site/presetpunk/index.html")
          text = index.read_text(encoding="utf-8")
          text = text.replace("__PRESETPUNK_BUILD_MS__", build)
          text = text.replace('const APP_VERSION = "0.1.0"', f'const APP_VERSION = "{ver}"')
          index.write_text(text, encoding="utf-8")

          def bust_imports(src: str) -> str:
              def repl(m: re.Match) -> str:
                  prefix, quote, path = m.group(1), m.group(2), m.group(3)
                  if "?v=" in path:
                      return m.group(0)
                  return f"{prefix}{quote}{path}?v={build}{quote}"
              return re.sub(
                  r"""((?:from|import)\s*\(?\s*)(['"])(\./[^'"]+\.js)\2""",
                  repl,
                  src,
              )

          lib = Path("_site/presetpunk/lib")
          for path in lib.glob("*.js"):
              path.write_text(bust_imports(path.read_text(encoding="utf-8")), encoding="utf-8")
          print(f"presetpunk stamp v{ver}+{build}")
          PY

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
