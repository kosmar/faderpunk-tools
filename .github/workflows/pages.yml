name: Deploy GitHub Pages
# venn-catalog redeploy marker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: scopepunk/pnpm-lock.yaml

      - name: Build Scopepunk
        working-directory: scopepunk
        env:
          GITHUB_PAGES: "1"
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Assemble site
        run: |
          mkdir -p _site/presetpunk _site/scopepunk
          rsync -a \
            --exclude node_modules \
            --exclude midi \
            --exclude out \
            --exclude .chrome-profile \
            --exclude .DS_Store \
            --exclude tests \
            --exclude tools \
            presetpunk/ _site/presetpunk/
          rsync -a scopepunk/dist/ _site/scopepunk/
          cp site/index.html _site/index.html
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
